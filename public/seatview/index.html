<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vantage Seat View</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed night-stadium canvas; glass panels float over it (venues left, finder bottom-left, seat ticket bottom-right). */
:root {
  --night: #05070f; --glass: rgba(11, 15, 30, 0.8); --glass-hi: rgba(22, 29, 54, 0.9);
  --fg: #e9edf8; --muted: #8b94b0; --line: rgba(140, 162, 230, 0.18);
  --accent: #ffcf3a; --club: #e0773c; --blue: #4c8dff;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--fg); font: 15px/1.45 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.panel { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--line); border-radius: 14px; }
.label { font: 600 11px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; gap: 16px; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.top > * { pointer-events: auto; }
.brand { font: 700 20px/1 var(--display); letter-spacing: 0.2em; padding: 11px 14px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.title { flex: 1; min-width: 0; text-align: center; padding-top: 2px; text-shadow: 0 2px 18px rgba(0,0,0,0.8); }
.title h1 { margin: 0; font: 700 clamp(26px, 3.4vw, 44px)/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; text-wrap: balance; }
.title p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.title small { display: block; margin-top: 4px; color: #5f6886; font-size: 12px; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--glass-hi); border-radius: 10px; padding: 10px 14px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: rgba(160, 185, 255, 0.45); }
.btn.primary { background: var(--accent); color: #1a1405; border-color: transparent; }
.btn.ghost { background: transparent; }
#menuBtn { display: none; }

/* venue list */
#sidebar { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 76px); bottom: 186px; width: 300px; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 10px 10px 0; }
.tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font: 600 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tabs button[aria-selected="true"] { background: rgba(76, 141, 255, 0.16); color: var(--fg); }
.search { padding: 10px; display: grid; gap: 6px; }
.search input { width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); }
#list { list-style: none; margin: 0; padding: 0 6px 8px; overflow-y: auto; flex: 1; }
#list button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 9px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; column-gap: 8px; }
#list button:hover { background: rgba(255,255,255,0.04); }
#list button.on { background: rgba(255, 207, 58, 0.1); box-shadow: inset 2px 0 0 var(--accent); }
#list b { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#list small { grid-column: 1; color: var(--muted); font-size: 12px; }
#list em { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 600 13px/1 var(--display); font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

/* finder */
#finder { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 300px; padding: 14px; display: grid; gap: 10px; }
#finder .row { display: flex; align-items: center; gap: 10px; }
#finder select { background: rgba(0,0,0,0.3); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
#finder input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
#budgetVal { font: 600 16px/1 var(--display); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }

/* legend */
#legend { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; max-width: min(560px, calc(100vw - 680px)); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
#legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* seat ticket */
#seatPanel { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 330px; padding: 16px; display: grid; gap: 12px; }
#seatPanel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
#spTitle { margin: 4px 0 0; font: 600 20px/1.15 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
#closeBtn { border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 4px; }
.price { display: flex; align-items: baseline; gap: 10px; }
#spPrice { font: 700 34px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
#spEach { color: var(--muted); font-size: 13px; }
#spFacts { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px dashed var(--line); display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-weight: 600; font-size: 14px; }
#spFacts span { display: block; font: 500 11px/1.3 var(--body); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

#viewCaption { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 96px); padding: 8px 14px; font: 600 15px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
#tooltip { position: fixed; left: 0; top: 0; padding: 8px 10px; font-size: 13px; pointer-events: none; z-index: 5; font-variant-numeric: tabular-nums; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 140px); padding: 10px 16px; z-index: 6; max-width: calc(100vw - 32px); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,7,15,0.55); font: 600 14px/1 var(--display); letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); z-index: 8; }
.hint { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 76px); font-size: 12px; color: #5f6886; text-align: right; pointer-events: none; }

/* seat mode */
body.seat-mode #sidebar, body.seat-mode #legend, body.seat-mode .hint { display: none; }

/* cinematic (screen-record) mode */
#cineTitle { display: none; }
body.cine .top, body.cine #sidebar, body.cine #finder, body.cine #legend, body.cine #seatPanel, body.cine .hint, body.cine #viewCaption, body.cine #tooltip { display: none !important; }
body.cine #cineTitle { display: block; position: fixed; left: max(28px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); text-shadow: 0 4px 30px rgba(0,0,0,0.9); pointer-events: none; }
#cineName { font: 700 clamp(40px, 7vw, 96px)/0.9 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
#cineMeta { margin-top: 10px; font: 600 clamp(14px, 1.6vw, 20px)/1 var(--display); letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); }
#cineExit { display: none; }
body.cine #cineExit { display: block; position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 16px); opacity: 0.25; }
body.cine #cineExit:hover { opacity: 1; }

/* partner embed */
body.embed #sidebar, body.embed .brand, body.embed #cineBtn, body.embed .hint { display: none; }

@media (max-width: 860px) {
  .top { gap: 8px; }
  .brand { display: none; }
  #menuBtn { display: block; }
  .title h1 { font-size: 24px; }
  .title p { font-size: 12px; }
  .title small, .hint { display: none; }
  #sidebar { top: calc(env(safe-area-inset-top, 0px) + 70px); bottom: auto; max-height: 62vh; width: auto; right: max(16px, env(safe-area-inset-right, 0px)); display: none; z-index: 4; }
  body.menu-open #sidebar { display: flex; }
  #legend { display: none; }
  #finder { width: auto; right: max(16px, env(safe-area-inset-right, 0px)); padding: 12px; }
  #seatPanel { width: auto; left: max(16px, env(safe-area-inset-left, 0px)); z-index: 3; }
  #viewCaption { top: calc(env(safe-area-inset-top, 0px) + 84px); font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" aria-label="3D stadium seat map. Click a seat to select it."></canvas>

<div class="top">
  <button class="btn" id="menuBtn" aria-controls="sidebar">Venues</button>
  <div class="brand panel"><i></i>VANTAGE</div>
  <div class="title">
    <h1 id="vName">Loading</h1>
    <p id="vMeta"></p>
    <small id="vStats"></small>
  </div>
  <button class="btn" id="cineBtn" title="Hides the interface and tours each venue: good for screen-recorded clips">Cinematic</button>
</div>

<aside id="sidebar" class="panel" aria-label="Venues">
  <div class="tabs" role="tablist">
    <button data-region="uk" role="tab" aria-selected="true">UK &amp; IE</button>
    <button data-region="europe" role="tab" aria-selected="false">Europe</button>
    <button data-region="world" role="tab" aria-selected="false">World</button>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="Search venue, city or club" autocomplete="off">
    <span class="label" id="count"></span>
  </div>
  <ul id="list"></ul>
</aside>

<section id="finder" class="panel" aria-label="Find seats">
  <span class="label">Best available</span>
  <div class="row">
    <select id="qty" aria-label="Number of tickets">
      <option value="1">1 ticket</option><option value="2" selected>2 tickets</option><option value="3">3 tickets</option>
      <option value="4">4 tickets</option><option value="5">5 tickets</option><option value="6">6 tickets</option>
    </select>
    <input id="budget" type="range" aria-label="Maximum price per ticket">
    <span id="budgetVal"></span>
  </div>
  <button class="btn primary" id="findBtn">Find seats together</button>
</section>

<div id="legend" aria-label="Price key"></div>
<p class="hint">Drag to orbit · scroll to zoom<br>Hover a section, click any seat</p>

<section id="seatPanel" class="panel" hidden aria-live="polite">
  <header>
    <div><span class="label">Your seats</span><h2 id="spTitle"></h2></div>
    <button id="closeBtn" aria-label="Clear selection">×</button>
  </header>
  <div class="price"><span id="spPrice"></span><span id="spEach"></span></div>
  <ul id="spFacts"></ul>
  <div class="actions">
    <button class="btn" id="viewBtn">View from seat</button>
    <button class="btn" id="backBtn" hidden>Back to bowl</button>
    <button class="btn primary" id="buyBtn">Continue</button>
  </div>
</section>

<div id="viewCaption" class="panel" hidden></div>
<div id="tooltip" class="panel" hidden></div>
<div id="toast" class="panel" hidden role="status"></div>
<div id="loading">Building venue</div>
<div id="cineTitle"><div id="cineName"></div><div id="cineMeta"></div></div>
<button class="btn ghost" id="cineExit">Exit cinematic</button>

<script type="module" src="./app.js"></script>
</body>
</html>
